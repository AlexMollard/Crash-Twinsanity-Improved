<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Diagram of the Dimension Skip: an arc leaps from Iceberg Lab over six levels straight to the 10th dimension lab, and the two speedrun categories are compared as bars, 24 minutes 17 seconds without the skip against 9 minutes 30 seconds with it.">
  <rect width="900" height="300" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">Dimension Skip</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">One unchecked cutscene flag removes six levels from the run.</text>

  <!-- the arc -->
  <path d="M150 116 C 260 46, 600 46, 706 116" stroke="#f2a33c" stroke-width="2.5" fill="none"/>
  <polygon points="706,118 698,104 714,104" fill="#f2a33c"/>
  <text x="428" y="98" fill="#f2a33c" font-size="12.5" font-weight="700" text-anchor="middle">set the flag out of bounds, walk through a load wall</text>

  <!-- level chain -->
  <g>
    <rect x="86" y="124" width="128" height="34" rx="6" fill="#3f7fd4"/>
    <text x="150" y="146" fill="#0e1520" font-size="12" font-weight="700" text-anchor="middle">Iceberg Lab</text>

    <g fill="#2a303b" stroke="#3a4250">
      <rect x="240" y="128" width="62" height="26" rx="5"/>
      <rect x="312" y="128" width="62" height="26" rx="5"/>
      <rect x="384" y="128" width="62" height="26" rx="5"/>
      <rect x="456" y="128" width="62" height="26" rx="5"/>
      <rect x="528" y="128" width="62" height="26" rx="5"/>
      <rect x="600" y="128" width="62" height="26" rx="5"/>
    </g>

    <rect x="678" y="124" width="140" height="34" rx="6" fill="#3f7fd4"/>
    <text x="748" y="146" fill="#0e1520" font-size="12" font-weight="700" text-anchor="middle">10th dimension lab</text>
  </g>

  <!-- bracket under the six -->
  <path d="M240 168 L240 176 L662 176 L662 168" stroke="#6b7484" fill="none"/>
  <text x="451" y="194" fill="#98a2b3" font-size="12" text-anchor="middle">six levels, never loaded</text>

  <!-- comparison bars -->
  <text x="212" y="235" fill="#c2c9d6" font-size="12" text-anchor="end">Any% (No Dimension Skip)</text>
  <rect x="222" y="223" width="596" height="16" rx="4" fill="#4a5361"/>
  <text x="828" y="236" fill="#98a2b3" font-size="12" text-anchor="end">24:17</text>

  <text x="212" y="266" fill="#e8ebf1" font-size="12" text-anchor="end" font-weight="600">Any%</text>
  <rect x="222" y="254" width="233" height="16" rx="4" fill="#f2a33c"/>
  <text x="828" y="267" fill="#f2a33c" font-size="12" text-anchor="end" font-weight="700">9:30</text>

  <text x="28" y="288" fill="#6b7484" font-size="11">World records as of September 2026, both held by Gpro. The leaderboard splits on this one trick.</text>
</svg>
