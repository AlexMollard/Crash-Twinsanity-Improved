<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Anatomy of a Twinsanity script. A script holds numbered states; a state holds a flag word, an optional sub-script and a list of rules; a rule holds a condition with a parameter, interval and threshold, a target state, and the commands that run on the transition into that target.">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#5b96e0"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#f2a33c"/>
    </marker>
  </defs>

  <rect width="900" height="400" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">What a script is made of</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">Script → states → rules → commands. The commands hang off the <tspan fill="#f2a33c">rule</tspan>, which is the part that catches people out.</text>

  <!-- script container -->
  <rect x="56" y="92" width="320" height="230" rx="8" fill="#20242d" stroke="#2c323d"/>
  <text x="72" y="113" fill="#5b96e0" font-size="11.5" font-weight="700">Script  COM_TIKI_MON_ACTIVATED</text>

  <rect x="74" y="124" width="284" height="44" rx="5" fill="#3a4250"/>
  <text x="90" y="151" fill="#c2c9d6" font-size="12">state 0</text>

  <rect x="74" y="176" width="284" height="44" rx="5" fill="#3f7fd4" stroke="#8fc0ff" stroke-width="2"/>
  <text x="90" y="197" fill="#0e1520" font-size="12" font-weight="700">state 1</text>
  <text x="90" y="212" fill="#12293f" font-size="9.5">expanded to the right →</text>

  <rect x="74" y="228" width="284" height="44" rx="5" fill="#2f5c45"/>
  <text x="90" y="250" fill="#a9d9c0" font-size="12" font-weight="700">state 2</text>
  <text x="90" y="264" fill="#79b59a" font-size="9.5">the target</text>

  <text x="72" y="300" fill="#6b7484" font-size="10.5">One state is the start state. It is not always state 0.</text>

  <!-- panel A: inside a state -->
  <rect x="414" y="104" width="208" height="152" rx="8" fill="#20242d" stroke="#3f7fd4"/>
  <text x="430" y="125" fill="#5b96e0" font-size="11.5" font-weight="700">inside state 1</text>
  <text x="430" y="147" fill="#e8ebf1" font-size="11">flags <tspan fill="#f2a33c">0x8821</tspan></text>
  <text x="430" y="161" fill="#7d8798" font-size="9.5">polled — rules re-checked every frame</text>
  <text x="430" y="184" fill="#e8ebf1" font-size="11">sub-script <tspan fill="#98a2b3">(optional)</tspan></text>
  <text x="430" y="198" fill="#7d8798" font-size="9.5">runs to completion while the state is active</text>
  <text x="430" y="221" fill="#e8ebf1" font-size="11">rules</text>
  <rect x="430" y="229" width="78" height="18" rx="4" fill="#5a4a6e" stroke="#c2a5f0" stroke-width="1.5"/>
  <text x="469" y="242" fill="#e6dcf2" font-size="10" text-anchor="middle">rule [0]</text>
  <rect x="516" y="229" width="78" height="18" rx="4" fill="#3a3345"/>
  <text x="555" y="242" fill="#b3a4c6" font-size="10" text-anchor="middle">rule [1]</text>

  <!-- panel B: inside a rule -->
  <rect x="650" y="104" width="204" height="196" rx="8" fill="#20242d" stroke="#c2a5f0"/>
  <text x="666" y="125" fill="#c2a5f0" font-size="11.5" font-weight="700">inside rule [0]</text>

  <text x="666" y="147" fill="#e8ebf1" font-size="11">condition <tspan fill="#f2a33c">TimeInUnit</tspan>(p=0)</text>
  <text x="666" y="161" fill="#7d8798" font-size="9.5">interval 0 · threshold 0.5</text>
  <text x="666" y="175" fill="#7d8798" font-size="9.5">“0.5 seconds have passed”</text>

  <text x="666" y="199" fill="#e8ebf1" font-size="11">target → <tspan fill="#79b59a" font-weight="700">state 2</tspan></text>

  <text x="666" y="223" fill="#e8ebf1" font-size="11">commands</text>
  <g font-size="10">
    <rect x="666" y="231" width="172" height="17" rx="4" fill="#8a6a2e"/>
    <text x="675" y="244" fill="#f4e4c4">DoAnim(…)</text>
    <rect x="666" y="252" width="172" height="17" rx="4" fill="#8a6a2e"/>
    <text x="675" y="265" fill="#f4e4c4">SetAgent(64)</text>
    <rect x="666" y="273" width="172" height="17" rx="4" fill="#8a6a2e"/>
    <text x="675" y="286" fill="#f4e4c4">SendUserMessage(207)</text>
  </g>

  <!-- expansion connectors -->
  <g stroke="#5b96e0" stroke-width="1.8" fill="none" marker-end="url(#a1)">
    <path d="M358 198 C 386 198, 386 160, 408 160"/>
    <path d="M594 238 C 622 238, 628 200, 644 200"/>
  </g>

  <!-- the transition arrow: the whole point -->
  <path d="M752 300 C 660 356, 430 348, 366 258" stroke="#f2a33c" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="556" y="368" fill="#f2a33c" font-size="12" font-weight="700" text-anchor="middle">the commands run on the way out, as the machine moves into state 2</text>
  <text x="556" y="384" fill="#6b7484" font-size="10.5" text-anchor="middle">not when state 2 begins — to act on entry, attach them to the rule that leads in</text>
</svg>
