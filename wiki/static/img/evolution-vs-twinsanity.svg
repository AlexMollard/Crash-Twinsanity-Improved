<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Side by side comparison of Crash Bandicoot Evolution and Crash Twinsanity. Evolution was serious and epic, with a patchwork planet, an alien ant invasion and an arm-riding sidekick called Foofie, structured as an RPG and platformer hybrid. It was abandoned when Ratchet and Clank shipped in 2002, and restarted as Twinsanity, a comedy with Cortex carried as the sidekick and an open connected world.">
  <rect width="900" height="366" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">The same project, twice</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">What the team was building before 2002, and what they built instead.</text>

  <!-- panels -->
  <rect x="48" y="76" width="368" height="238" rx="8" fill="#241e30" stroke="#3b3049"/>
  <text x="68" y="100" fill="#c2a5f0" font-size="13" font-weight="700">Crash Bandicoot Evolution</text>
  <text x="68" y="116" fill="#8e7fa6" font-size="10.5">2001 — 2002 · never shipped</text>

  <rect x="484" y="76" width="368" height="238" rx="8" fill="#2e2413" stroke="#5a4520"/>
  <text x="504" y="100" fill="#f2a33c" font-size="13" font-weight="700">Crash Twinsanity</text>
  <text x="504" y="116" fill="#b08a4e" font-size="10.5">2002 — 2004 · shipped 28 Sep 2004</text>

  <!-- rows -->
  <g font-size="11">
    <text x="68" y="146" fill="#6b7484" font-size="9.5" font-weight="700">TONE</text>
    <text x="68" y="162" fill="#ded6ea">Serious, epic</text>
    <text x="504" y="146" fill="#6b7484" font-size="9.5" font-weight="700">TONE</text>
    <text x="504" y="162" fill="#f0e3cb">As funny as possible</text>

    <text x="68" y="188" fill="#6b7484" font-size="9.5" font-weight="700">PREMISE</text>
    <text x="68" y="204" fill="#ded6ea">Crash's island grafted onto a patchwork</text>
    <text x="68" y="218" fill="#ded6ea">planet; an alien ant invasion</text>
    <text x="504" y="188" fill="#6b7484" font-size="9.5" font-weight="700">PREMISE</text>
    <text x="504" y="204" fill="#f0e3cb">The Evil Twins want the treasure, and</text>
    <text x="504" y="218" fill="#f0e3cb">Crash and Cortex are stuck together</text>

    <text x="68" y="244" fill="#6b7484" font-size="9.5" font-weight="700">SIDEKICK</text>
    <text x="68" y="260" fill="#ded6ea">Foofie, an alien riding Crash's arm,</text>
    <text x="68" y="274" fill="#ded6ea">used to solve puzzles</text>
    <text x="504" y="244" fill="#6b7484" font-size="9.5" font-weight="700">SIDEKICK</text>
    <text x="504" y="260" fill="#f0e3cb">Cortex — carried, swung and thrown</text>
    <text x="504" y="274" fill="#f0e3cb">as the level's main tool</text>

    <text x="68" y="298" fill="#6b7484" font-size="9.5" font-weight="700">SHAPE</text>
    <text x="150" y="298" fill="#ded6ea">RPG / platformer hybrid, Zelda cited</text>
    <text x="504" y="298" fill="#6b7484" font-size="9.5" font-weight="700">SHAPE</text>
    <text x="586" y="298" fill="#f0e3cb">One open, connected world</text>
  </g>

  <!-- the break in the middle -->
  <line x1="450" y1="86" x2="450" y2="304" stroke="#e05c5c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="450" cy="195" r="26" fill="#e05c5c"/>
  <text x="450" y="191" fill="#2b0f0f" font-size="9.5" font-weight="700" text-anchor="middle">R&amp;C</text>
  <text x="450" y="203" fill="#2b0f0f" font-size="9.5" font-weight="700" text-anchor="middle">2002</text>

  <text x="450" y="340" fill="#e05c5c" font-size="11.5" font-weight="600" text-anchor="middle">Ratchet &amp; Clank shipped with the same planet-hopping premise, so Evolution was scrapped</text>
  <text x="450" y="356" fill="#6b7484" font-size="10.5" text-anchor="middle">The ship date did not move. Everything to the right was built in what was left.</text>
</svg>
