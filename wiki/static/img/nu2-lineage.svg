<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Timeline of Traveller's Tales' Nu2 engine from 1997 to 2024, showing Crash Twinsanity in 2004 within the PlayStation 2 generation, and the line continuing through the LEGO games to NXG, NTT and Unreal.">
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7fd4"/><stop offset="1" stop-color="#639ae6"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34608f"/><stop offset="1" stop-color="#3f76ad"/>
    </linearGradient>
  </defs>

  <rect width="900" height="366" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">One engine, eighteen years</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">Traveller's Tales' Nu2 framework. Twinsanity sits in its first PlayStation 2 generation.</text>

  <!-- Twinsanity callout -->
  <rect x="333" y="66" width="151" height="22" rx="5" fill="#f2a33c"/>
  <text x="408" y="81.5" fill="#171a21" font-size="12.5" font-weight="700" text-anchor="middle">Crash Twinsanity · 2004</text>
  <line x1="408" y1="88" x2="408" y2="128" stroke="#f2a33c" stroke-width="2"/>

  <!-- rows: label, bar, examples -->
  <g font-size="12">
    <text x="232" y="114" fill="#98a2b3" text-anchor="end">Sonic R engine</text>
    <rect x="246" y="103" width="23" height="14" rx="3" fill="#3f4756"/>

    <text x="232" y="141" fill="#e8ebf1" text-anchor="end" font-weight="600">Nu2 · PS2 generation</text>
    <rect x="339" y="129" width="116" height="17" rx="4" fill="url(#hot)"/>
    <text x="339" y="161" fill="#7d8798" font-size="10.5">Wrath of Cortex · Haven · Finding Nemo · Super Monkey Ball Adventure</text>

    <text x="232" y="186" fill="#c2c9d6" text-anchor="end">Nu2 · NUP</text>
    <rect x="432" y="175" width="46" height="14" rx="3" fill="url(#cool)"/>
    <text x="432" y="204" fill="#7d8798" font-size="10.5">Lego Star Wars I &amp; II · Narnia · Bionicle Heroes</text>

    <text x="232" y="229" fill="#c2c9d6" text-anchor="end">Nu2 · PS2-HD</text>
    <rect x="478" y="218" width="46" height="14" rx="3" fill="url(#cool)"/>
    <text x="478" y="247" fill="#7d8798" font-size="10.5">Transformers · Complete Saga · Lego Indiana Jones · Lego Batman</text>

    <text x="232" y="272" fill="#c2c9d6" text-anchor="end">Nu2 · Next-Gen (NXG)</text>
    <rect x="524" y="261" width="232" height="14" rx="3" fill="url(#cool)"/>
    <text x="524" y="290" fill="#7d8798" font-size="10.5">Lego Harry Potter → The Lego Movie 2 Video Game</text>

    <text x="232" y="315" fill="#c2c9d6" text-anchor="end">NTT, then Unreal</text>
    <rect x="826" y="304" width="24" height="14" rx="3" fill="#8b5cf6"/>
    <text x="872" y="333" fill="#7d8798" font-size="10.5" text-anchor="end">Lego Star Wars: The Skywalker Saga</text>
  </g>

  <circle cx="408" cy="137.5" r="6" fill="#f2a33c" stroke="#171a21" stroke-width="2"/>

  <!-- axis -->
  <line x1="246" y1="345" x2="872" y2="345" stroke="#333a47"/>
  <g font-size="11" fill="#7d8798" text-anchor="middle">
    <g stroke="#333a47">
      <line x1="246" y1="345" x2="246" y2="351"/>
      <line x1="339" y1="345" x2="339" y2="351"/>
      <line x1="408" y1="345" x2="408" y2="351"/>
      <line x1="524" y1="345" x2="524" y2="351"/>
      <line x1="756" y1="345" x2="756" y2="351"/>
      <line x1="872" y1="345" x2="872" y2="351"/>
    </g>
    <text x="246" y="363">1997</text>
    <text x="339" y="363">2001</text>
    <text x="408" y="363" fill="#f2a33c" font-weight="600">2004</text>
    <text x="524" y="363">2009</text>
    <text x="756" y="363">2019</text>
    <text x="872" y="363">2024</text>
  </g>
</svg>
