<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A real Twinsanity cutscene director script drawn as a state machine. States 0, 1 and 2 run in sequence to the end state 4. State 5 holds the skip rule on condition 572 and leads to the skip path in state 3, but nothing in the script reaches state 5, which is the damage the mod repairs.">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#6b7484"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#4a9e6b"/>
    </marker>
  </defs>

  <rect width="900" height="380" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">A script is a state machine, and the rules carry the commands</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">The Iceberg Lab cutscene director, exactly as it ships. Every behaviour in the game has this shape.</text>

  <!-- main chain -->
  <g>
    <rect x="70" y="118" width="120" height="48" rx="6" fill="#3f7fd4"/>
    <text x="130" y="137" fill="#0e1520" font-size="12.5" font-weight="700" text-anchor="middle">state 0</text>
    <text x="130" y="154" fill="#12293f" font-size="9.5" text-anchor="middle">CUTSCENE_BEGIN</text>

    <rect x="240" y="118" width="120" height="48" rx="6" fill="#3f7fd4"/>
    <text x="300" y="137" fill="#0e1520" font-size="12.5" font-weight="700" text-anchor="middle">state 1</text>
    <text x="300" y="154" fill="#12293f" font-size="9.5" text-anchor="middle">the scene itself</text>

    <rect x="410" y="118" width="120" height="48" rx="6" fill="#3f7fd4"/>
    <text x="470" y="137" fill="#0e1520" font-size="12.5" font-weight="700" text-anchor="middle">state 2</text>
    <text x="470" y="154" fill="#12293f" font-size="9.5" text-anchor="middle">tidy up</text>

    <rect x="580" y="118" width="120" height="48" rx="6" fill="#4a5361"/>
    <text x="640" y="142" fill="#e8ebf1" font-size="12.5" font-weight="700" text-anchor="middle">state 4</text>
    <text x="640" y="157" fill="#98a2b3" font-size="9.5" text-anchor="middle">end</text>
  </g>

  <!-- skip path -->
  <g>
    <rect x="240" y="238" width="120" height="48" rx="6" fill="#5a4a6e"/>
    <text x="300" y="257" fill="#e6dcf2" font-size="12.5" font-weight="700" text-anchor="middle">state 5</text>
    <text x="300" y="273" fill="#b3a4c6" font-size="9.5" text-anchor="middle">holds the skip rule</text>

    <rect x="410" y="238" width="120" height="48" rx="6" fill="#5a4a6e"/>
    <text x="470" y="257" fill="#e6dcf2" font-size="12.5" font-weight="700" text-anchor="middle">state 3</text>
    <text x="470" y="273" fill="#b3a4c6" font-size="9.5" text-anchor="middle">CUTSCENE_SKIP</text>
  </g>

  <!-- transitions -->
  <g stroke="#6b7484" stroke-width="1.8" fill="none" marker-end="url(#ah)">
    <line x1="190" y1="142" x2="232" y2="142"/>
    <line x1="360" y1="142" x2="402" y2="142"/>
    <line x1="530" y1="142" x2="572" y2="142"/>
    <line x1="360" y1="262" x2="402" y2="262"/>
    <path d="M470 238 L470 174"/>
  </g>

  <g font-size="10.5" fill="#98a2b3" text-anchor="middle">
    <text x="211" y="134">Next</text>
    <text x="381" y="134">Next</text>
    <text x="551" y="134">Next</text>
    <text x="381" y="254">Next</text>
  </g>

  <!-- the command on a transition -->
  <text x="551" y="178" fill="#f2a33c" font-size="10.5" text-anchor="middle">ToggleCutsceneCamera()</text>
  <text x="551" y="191" fill="#6b7484" font-size="9.5" text-anchor="middle">a command, on the rule</text>

  <!-- the skip rule label -->
  <text x="300" y="306" fill="#c2a5f0" font-size="10.5" text-anchor="middle">if CutsceneSkipped (572)</text>

  <!-- the break -->
  <g stroke="#e05c5c" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="120" y1="262" x2="228" y2="262"/>
  </g>
  <g stroke="#e05c5c" stroke-width="2.5">
    <line x1="162" y1="252" x2="182" y2="272"/>
    <line x1="182" y1="252" x2="162" y2="272"/>
  </g>
  <text x="112" y="266" fill="#e05c5c" font-size="11" font-weight="700" text-anchor="end">nothing</text>
  <text x="112" y="280" fill="#e05c5c" font-size="11" font-weight="700" text-anchor="end">reaches it</text>

  <!-- anatomy strip -->
  <rect x="70" y="326" width="784" height="38" rx="6" fill="#20242d" stroke="#2c323d"/>
  <text x="86" y="343" fill="#5b96e0" font-size="11" font-weight="700">a state</text>
  <text x="148" y="343" fill="#b6becb" font-size="11">flags (instant or polled) · an optional sub-script · a list of rules</text>
  <text x="86" y="358" fill="#c2a5f0" font-size="11" font-weight="700">a rule</text>
  <text x="148" y="358" fill="#b6becb" font-size="11">condition(param) with an interval and threshold → a target state, plus the commands that run on the way out</text>
</svg>
