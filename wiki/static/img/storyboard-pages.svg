<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Bar chart of the 161 storyboard pages shipped on the disc across sixteen chapter sets. The first eight chapters carry 103 pages between them, peaking at 17 for Ice Climb, while the last eight carry 58, and the finale set has the fewest of any chapter at five pages.">
  <rect width="900" height="380" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">161 storyboard pages, sixteen chapters, one visible taper</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">Shipped in the disc's own Extras gallery — the game being planned, chapter by chapter.</text>

  <!-- gridlines -->
  <g stroke="#262c38" stroke-width="1">
    <line x1="72" y1="288" x2="858" y2="288"/>
    <line x1="72" y1="233" x2="858" y2="233"/>
    <line x1="72" y1="178" x2="858" y2="178"/>
    <line x1="72" y1="123" x2="858" y2="123"/>
  </g>
  <g fill="#6b7484" font-size="9.5" text-anchor="end">
    <text x="64" y="292">0</text>
    <text x="64" y="237">5</text>
    <text x="64" y="182">10</text>
    <text x="64" y="127">15</text>
  </g>

  <!-- bars: x = 82 + i*48, width 36, 11px per page, baseline 288 -->
  <g>
    <rect x="82"  y="167" width="36" height="121" rx="3" fill="#3f7fd4"/><text x="100" y="161" fill="#8fc0ff" font-size="10" text-anchor="middle">11</text>
    <rect x="130" y="200" width="36" height="88"  rx="3" fill="#3f7fd4"/><text x="148" y="194" fill="#8fc0ff" font-size="10" text-anchor="middle">8</text>
    <rect x="178" y="134" width="36" height="154" rx="3" fill="#3f7fd4"/><text x="196" y="128" fill="#8fc0ff" font-size="10" text-anchor="middle">14</text>
    <rect x="226" y="123" width="36" height="165" rx="3" fill="#3f7fd4"/><text x="244" y="117" fill="#8fc0ff" font-size="10" text-anchor="middle">15</text>
    <rect x="274" y="123" width="36" height="165" rx="3" fill="#3f7fd4"/><text x="292" y="117" fill="#8fc0ff" font-size="10" text-anchor="middle">15</text>
    <rect x="322" y="101" width="36" height="187" rx="3" fill="#5b96e0"/><text x="340" y="95"  fill="#8fc0ff" font-size="10" text-anchor="middle">17</text>
    <rect x="370" y="189" width="36" height="99"  rx="3" fill="#3f7fd4"/><text x="388" y="183" fill="#8fc0ff" font-size="10" text-anchor="middle">9</text>
    <rect x="418" y="134" width="36" height="154" rx="3" fill="#3f7fd4"/><text x="436" y="128" fill="#8fc0ff" font-size="10" text-anchor="middle">14</text>

    <rect x="466" y="200" width="36" height="88"  rx="3" fill="#4a5361"/><text x="484" y="194" fill="#98a2b3" font-size="10" text-anchor="middle">8</text>
    <rect x="514" y="211" width="36" height="77"  rx="3" fill="#4a5361"/><text x="532" y="205" fill="#98a2b3" font-size="10" text-anchor="middle">7</text>
    <rect x="562" y="189" width="36" height="99"  rx="3" fill="#4a5361"/><text x="580" y="183" fill="#98a2b3" font-size="10" text-anchor="middle">9</text>
    <rect x="610" y="211" width="36" height="77"  rx="3" fill="#4a5361"/><text x="628" y="205" fill="#98a2b3" font-size="10" text-anchor="middle">7</text>
    <rect x="658" y="233" width="36" height="55"  rx="3" fill="#f2a33c"/><text x="676" y="227" fill="#f2a33c" font-size="10" text-anchor="middle" font-weight="700">5</text>
    <rect x="706" y="222" width="36" height="66"  rx="3" fill="#4a5361"/><text x="724" y="216" fill="#98a2b3" font-size="10" text-anchor="middle">6</text>
    <rect x="754" y="222" width="36" height="66"  rx="3" fill="#4a5361"/><text x="772" y="216" fill="#98a2b3" font-size="10" text-anchor="middle">6</text>
    <rect x="802" y="178" width="36" height="110" rx="3" fill="#4a5361"/><text x="820" y="172" fill="#98a2b3" font-size="10" text-anchor="middle">10</text>
  </g>

  <!-- chapter labels -->
  <g font-size="9" fill="#7d8798">
    <text x="100" y="300" transform="rotate(-45 100 300)" text-anchor="end">01 N.Sanity</text>
    <text x="148" y="300" transform="rotate(-45 148 300)" text-anchor="end">02 Jungle</text>
    <text x="196" y="300" transform="rotate(-45 196 300)" text-anchor="end">03 Cavern</text>
    <text x="244" y="300" transform="rotate(-45 244 300)" text-anchor="end">04 Totem</text>
    <text x="292" y="300" transform="rotate(-45 292 300)" text-anchor="end">05 IceHub</text>
    <text x="340" y="300" transform="rotate(-45 340 300)" text-anchor="end">06 IceClimb</text>
    <text x="388" y="300" transform="rotate(-45 388 300)" text-anchor="end">07 Slip</text>
    <text x="436" y="300" transform="rotate(-45 436 300)" text-anchor="end">08 HighSeas</text>
    <text x="484" y="300" transform="rotate(-45 484 300)" text-anchor="end">09 Academy</text>
    <text x="532" y="300" transform="rotate(-45 532 300)" text-anchor="end">10 Boiler</text>
    <text x="580" y="300" transform="rotate(-45 580 300)" text-anchor="end">11 Classroom</text>
    <text x="628" y="300" transform="rotate(-45 628 300)" text-anchor="end">12 Rooftop</text>
    <text x="676" y="300" transform="rotate(-45 676 300)" text-anchor="end" fill="#f2a33c">13 Twinsanity</text>
    <text x="724" y="300" transform="rotate(-45 724 300)" text-anchor="end">14 Rockslide</text>
    <text x="772" y="300" transform="rotate(-45 772 300)" text-anchor="end">15 Pursuit</text>
    <text x="820" y="300" transform="rotate(-45 820 300)" text-anchor="end">16 AntAgony</text>
  </g>

  <!-- halves -->
  <path d="M82 356 L82 350 L454 350 L454 356" stroke="#5b96e0" fill="none"/>
  <text x="268" y="372" fill="#5b96e0" font-size="11.5" text-anchor="middle" font-weight="600">first eight chapters · 103 pages</text>
  <path d="M466 356 L466 350 L838 350 L838 356" stroke="#7d8798" fill="none"/>
  <text x="652" y="372" fill="#98a2b3" font-size="11.5" text-anchor="middle">last eight · 58 pages</text>
</svg>
