<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Disc layout before and after the build. A PlayStation 2 DVD reads its outer edge up to two and a half times faster than its inner edge. CRASH.BD originally started 225 megabytes in, on the slow half; the build moves it to the outer edge and packs the files that followed it into the space it left, without changing the image size.">
  <defs>
    <linearGradient id="spd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c3b34"/><stop offset="1" stop-color="#2f6b4a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="350" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">Moving the level data to the fast edge of the disc</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">A PS2 spins a DVD at a constant angular speed, so the outer edge reads up to 2.5× faster than the inner.</text>

  <!-- speed strip -->
  <rect x="140" y="80" width="700" height="13" rx="3" fill="url(#spd)"/>
  <text x="140" y="108" fill="#c98b7d" font-size="10.5">inner edge · 0.40× read speed</text>
  <text x="840" y="108" fill="#6fbf95" font-size="10.5" text-anchor="end">outer edge · 1.00×</text>

  <!-- before -->
  <text x="130" y="152" fill="#98a2b3" font-size="12" text-anchor="end" font-weight="600">retail</text>
  <g>
    <rect x="140" y="130" width="64" height="40" rx="4" fill="#3a4250"/>
    <rect x="206" y="130" width="253" height="40" rx="4" fill="#e05c5c"/>
    <text x="332" y="148" fill="#2b0f0f" font-size="12" font-weight="700" text-anchor="middle">CRASH.BD</text>
    <text x="332" y="162" fill="#5e2323" font-size="9.5" text-anchor="middle">887 MB of level data, on the slow half</text>
    <rect x="461" y="130" width="379" height="40" rx="4" fill="#4a5361"/>
    <text x="650" y="154" fill="#b6becb" font-size="11" text-anchor="middle">speech banks · IOP modules · movies</text>
  </g>

  <!-- after -->
  <text x="130" y="244" fill="#f2a33c" font-size="12" text-anchor="end" font-weight="600">modded</text>
  <g>
    <rect x="140" y="222" width="64" height="40" rx="4" fill="#3a4250"/>
    <rect x="206" y="222" width="379" height="40" rx="4" fill="#4a5361"/>
    <text x="395" y="246" fill="#b6becb" font-size="11" text-anchor="middle">the same 39 files, packed down into the gap</text>
    <rect x="587" y="222" width="253" height="40" rx="4" fill="#4a9e6b"/>
    <text x="713" y="240" fill="#0d1f16" font-size="12" font-weight="700" text-anchor="middle">CRASH.BD</text>
    <text x="713" y="254" fill="#1d4531" font-size="9.5" text-anchor="middle">same 887 MB, now on the fast edge</text>
  </g>

  <!-- move arrow -->
  <path d="M332 174 C 332 200, 713 194, 713 216" stroke="#f2a33c" stroke-width="2" fill="none"/>
  <polygon points="713,220 706,206 720,206" fill="#f2a33c"/>
  <text x="523" y="188" fill="#f2a33c" font-size="11" font-weight="600" text-anchor="middle">moved to the end</text>

  <!-- notes -->
  <text x="140" y="284" fill="#7d8798" font-size="10.5">The grey block at the left is the executable and boot files. The image stays exactly the same size, and the game finds every file by name, so nothing breaks.</text>

  <!-- results -->
  <rect x="140" y="296" width="700" height="38" rx="6" fill="#20242d" stroke="#2c323d"/>
  <text x="156" y="313" fill="#f2a33c" font-size="11" font-weight="700">Measured on the rig, fresh boot, to the moment Crash can move</text>
  <text x="156" y="328" fill="#b6becb" font-size="11">Earth hub 9.5 s → 7.0 s · Classroom Chaos 16.0 s → 10.5 s · and 5.5 s / 8.0 s with PCSX2's Fast CDVD on top</text>
</svg>
