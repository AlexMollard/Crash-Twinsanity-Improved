<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Family tree of Crash Twinsanity's six retail masters. NTSC PS2 1.0 comes first, the PAL builds add the crash fixes, and those fixes are then back-ported into NTSC PS2 2.0 and the Japanese release.">
  <rect width="900" height="340" rx="10" fill="#171a21"/>

  <text x="28" y="34" fill="#e8ebf1" font-size="17" font-weight="600">Six masters, and where the fixes went</text>
  <text x="28" y="54" fill="#98a2b3" font-size="12.5">Mastered between 5 August and 3 September 2004. This mod targets the PAL PS2 build.</text>

  <!-- first wave -->
  <text x="60" y="92" fill="#7d8798" font-size="11" font-weight="600">FIRST</text>
  <rect x="60" y="100" width="168" height="46" rx="6" fill="#4a5361"/>
  <text x="144" y="119" fill="#e8ebf1" font-size="12.5" font-weight="700" text-anchor="middle">NTSC PS2 1.0</text>
  <text x="144" y="136" fill="#b6becb" font-size="10.5" text-anchor="middle">5 Aug · the Dingodile crash</text>

  <rect x="60" y="158" width="168" height="40" rx="6" fill="#3a4250"/>
  <text x="144" y="175" fill="#c2c9d6" font-size="12" text-anchor="middle">NTSC Xbox</text>
  <text x="144" y="190" fill="#7d8798" font-size="10.5" text-anchor="middle">13 Aug · region-free</text>

  <!-- PAL wave -->
  <text x="366" y="92" fill="#f2a33c" font-size="11" font-weight="600">THE FIXES LAND</text>
  <rect x="366" y="100" width="182" height="46" rx="6" fill="#f2a33c"/>
  <text x="457" y="119" fill="#171a21" font-size="12.5" font-weight="700" text-anchor="middle">PAL PS2</text>
  <text x="457" y="136" fill="#4a3813" font-size="10.5" text-anchor="middle">3 Sep · 512×512 · 50 Hz</text>

  <rect x="366" y="158" width="182" height="40" rx="6" fill="#8a6a2e"/>
  <text x="457" y="175" fill="#f0e3cb" font-size="12" text-anchor="middle">PAL Xbox</text>
  <text x="457" y="190" fill="#c8b58e" font-size="10.5" text-anchor="middle">28 Aug · no Spanish</text>

  <!-- back-port wave -->
  <text x="686" y="92" fill="#7d8798" font-size="11" font-weight="600">BACK-PORTED</text>
  <rect x="686" y="100" width="168" height="46" rx="6" fill="#3f7fd4"/>
  <text x="770" y="119" fill="#0e1520" font-size="12.5" font-weight="700" text-anchor="middle">NTSC PS2 2.0</text>
  <text x="770" y="136" fill="#12293f" font-size="10.5" text-anchor="middle">Action Pack, 2007</text>

  <rect x="686" y="158" width="168" height="40" rx="6" fill="#34608f"/>
  <text x="770" y="175" fill="#dbe7f5" font-size="12" text-anchor="middle">NTSC-J PS2</text>
  <text x="770" y="190" fill="#9dbad6" font-size="10.5" text-anchor="middle">9 Dec · ○ to confirm</text>

  <!-- arrows -->
  <g stroke="#6b7484" stroke-width="1.5" fill="none">
    <path d="M228 123 L358 123"/>
    <path d="M228 178 L358 178"/>
  </g>
  <g stroke="#f2a33c" stroke-width="2" fill="none">
    <path d="M548 123 L678 123"/>
    <path d="M548 134 C 600 134, 620 178, 678 178"/>
  </g>
  <g fill="#6b7484">
    <polygon points="366,123 356,118 356,128"/>
    <polygon points="366,178 356,173 356,183"/>
  </g>
  <g fill="#f2a33c">
    <polygon points="686,123 676,118 676,128"/>
    <polygon points="686,178 676,173 676,183"/>
  </g>

  <!-- what the fixes were -->
  <rect x="60" y="232" width="794" height="66" rx="6" fill="#20242d" stroke="#2c323d"/>
  <text x="76" y="253" fill="#f2a33c" font-size="12" font-weight="700">What PAL fixed, and the others inherited</text>
  <text x="76" y="272" fill="#b6becb" font-size="11.5">The Dingodile crash · less gameplay lag · a stunned Coco no longer damages Crash · Nina's wall-jump tutorial reset</text>
  <text x="76" y="289" fill="#7d8798" font-size="11.5">Not inherited: the 50 Hz refresh, which is why PAL alone has no slide-deviation bug.</text>

  <text x="28" y="322" fill="#6b7484" font-size="11">A seventh release, the Russian one, is NTSC-U 1.0 with a localised font. The PAL Platinum reissue is identical to PAL PS2.</text>
</svg>
